[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strix-core"
version = "0.3.6"
description = "A native, local ASUS laptop control center"
requires-python = ">=3.11"

[project.gui-scripts]
strix-core = "strix_core.__main__:main"

[tool.setuptools]
packages = ["strix_core"]
include-package-data = true

[tool.setuptools.package-data]
strix_core = ["assets/*.css", "assets/*.svg"]
